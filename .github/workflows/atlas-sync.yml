name: Weekly atlas sync

on:
  schedule:
    - cron: "15 6 * * 1" # Monday 06:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache public geodata
        uses: actions/cache@v4
        with:
          path: ~/.cache/klepikhina-atlas
          key: atlas-geodata-${{ hashFiles('scripts/regions_config.json') }}
          restore-keys: atlas-geodata-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt

      - name: Sync sources, rebuild, and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KLEPIKINA_GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          KLEPIKINA_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          KLEPIKINA_STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          KLEPIKINA_STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          MOUNTAIN_PROJECT_TICKS_B64: ${{ secrets.MOUNTAIN_PROJECT_TICKS_B64 }}
        run: python scripts/cloud_sync.py
